name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  VERSION: v1.0.0
  IMAGE_NAME: togglemaster/targeting-service

jobs:
  build-and-unit-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall .

      - name: Run unit tests
        run: |
          if find . \( -name 'test_*.py' -o -name '*_test.py' \) -not -path './.git/*' -print -quit | grep -q .; then
            pip install pytest
            pytest -v
          else
            echo 'Nenhum teste unitario encontrado'
          fi

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 . --count --max-line-length=120 --extend-ignore=E203,W503,E402 --statistics

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SCA - Trivy dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-sca-report.txt
          exit-code: "1"

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-report
          path: trivy-sca-report.txt

      - name: SAST - Bandit
        run: |
          pip install bandit
          bandit -r . -lll

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image_tag=${VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}" .

      - name: Container scan - Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}"
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-image-report.txt
          exit-code: "1"

      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.txt

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${ECR_REGISTRY}/${IMAGE_NAME}:latest"
          docker push "${ECR_REGISTRY}/${IMAGE_NAME}:latest"

      - name: Update image tag in GitOps repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          git clone "https://x-access-token:${GITOPS_PAT}@github.com/lara-portilho/FIAP-DevOps-kubernetes.git" gitops-repo
          cd gitops-repo
          sed -i "s#image: .*${IMAGE_NAME}:.*#image: ${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}#" manifests/targeting-service/deployment.yaml
          if git diff --quiet; then
            echo "Nenhuma mudanca de imagem, nada a commitar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add manifests/targeting-service/deployment.yaml
            git commit -m "chore(targeting-service): atualiza imagem para ${IMAGE_TAG}"
            git push
          fi
